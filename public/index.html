<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northstar Homes – Talk to Riya</title>
    <meta
      name="description"
      content="Chat with Riya, your AI sales consultant at Northstar Homes, about Northstar One in Sector 79, Gurugram."
    />
    <style>
      /* ---- Reset & Base ---- */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f4f6f9;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 24px 16px;
        color: #1a1a2e;
      }

      /* ---- Header ---- */
      header {
        width: 100%;
        max-width: 680px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        width: 42px;
        height: 42px;
        background: #1a6b4a;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 20px;
        font-weight: 700;
        flex-shrink: 0;
      }

      header h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #1a1a2e;
      }

      header p {
        font-size: 0.8rem;
        color: #666;
        margin-top: 2px;
      }

      /* ---- Chat Window ---- */
      #chat-window {
        width: 100%;
        max-width: 680px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        display: flex;
        flex-direction: column;
        height: 520px;
        overflow: hidden;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scroll-behavior: smooth;
      }

      /* ---- Message Bubbles ---- */
      .msg {
        max-width: 75%;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 0.92rem;
        line-height: 1.5;
        word-break: break-word;
      }

      /* Agent (Riya) – left-aligned */
      .msg.agent {
        align-self: flex-start;
        background: #f0f4ff;
        color: #1a1a2e;
        border-bottom-left-radius: 4px;
      }

      .msg.agent .sender-label {
        font-size: 0.7rem;
        font-weight: 600;
        color: #1a6b4a;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }

      /* User – right-aligned */
      .msg.user {
        align-self: flex-end;
        background: #1a6b4a;
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      /* Typing indicator */
      .msg.typing {
        align-self: flex-start;
        background: #f0f4ff;
        color: #888;
        font-style: italic;
        font-size: 0.88rem;
        border-bottom-left-radius: 4px;
      }

      /* ---- Input Bar ---- */
      #input-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid #eee;
        background: #fff;
        border-bottom-left-radius: 16px;
        border-bottom-right-radius: 16px;
      }

      #user-input {
        flex: 1;
        border: 1px solid #dde1e9;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.92rem;
        outline: none;
        resize: none;
        font-family: inherit;
        color: #1a1a2e;
        transition: border-color 0.2s;
        line-height: 1.4;
        max-height: 120px;
        overflow-y: auto;
      }

      #user-input:focus { border-color: #1a6b4a; }

      #send-btn {
        background: #1a6b4a;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
      }

      #send-btn:hover:not(:disabled) { background: #155c3f; }
      #send-btn:disabled { background: #a0c4b5; cursor: not-allowed; }

      /* ---- Action Bar (below chat) ---- */
      #action-bar {
        width: 100%;
        max-width: 680px;
        margin-top: 12px;
        display: flex;
        justify-content: flex-end;
      }

      #end-btn {
        background: #fff;
        color: #c0392b;
        border: 1.5px solid #c0392b;
        border-radius: 8px;
        padding: 8px 18px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
      }

      #end-btn:hover:not(:disabled) { background: #c0392b; color: #fff; }
      #end-btn:disabled { opacity: 0.5; cursor: not-allowed; }

      /* ---- Analytics Panel ---- */
      #analytics-panel {
        width: 100%;
        max-width: 680px;
        margin-top: 20px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        padding: 20px;
        display: none; /* hidden until end-session is called */
      }

      #analytics-panel h2 {
        font-size: 1rem;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eee;
      }

      #analytics-content {
        font-family: "Courier New", Courier, monospace;
        font-size: 0.82rem;
        background: #f6f8fa;
        border-radius: 8px;
        padding: 14px;
        color: #1a1a2e;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.6;
      }

      /* ---- Scrollbar style ---- */
      #messages::-webkit-scrollbar { width: 4px; }
      #messages::-webkit-scrollbar-track { background: transparent; }
      #messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">N</div>
      <div>
        <h1>Northstar Homes</h1>
        <p>Chat with Riya · AI Sales Consultant · Northstar One, Sector 79, Gurugram</p>
      </div>
    </header>

    <div id="chat-window" role="main" aria-label="Chat with Riya">
      <div id="messages" aria-live="polite" aria-label="Conversation"></div>
      <div id="input-bar">
        <textarea
          id="user-input"
          rows="1"
          placeholder="Type your message…"
          aria-label="Your message"
          autocomplete="off"
        ></textarea>
        <button id="send-btn" aria-label="Send message">Send</button>
      </div>
    </div>

    <div id="action-bar">
      <button id="end-btn" aria-label="End conversation and view lead summary">End Conversation</button>
    </div>

    <section id="analytics-panel" aria-label="Lead analytics">
      <h2>Lead Analytics Summary</h2>
      <pre id="analytics-content"></pre>
    </section>

    <script>
      // -----------------------------------------------------------------------
      // Session setup
      // Each page load gets a fresh session ID — conversations are not persisted.
      // -----------------------------------------------------------------------
      const sessionId = crypto.randomUUID();

      // -----------------------------------------------------------------------
      // DOM references
      // -----------------------------------------------------------------------
      const messagesEl = document.getElementById("messages");
      const inputEl = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const endBtn = document.getElementById("end-btn");
      const analyticsPanel = document.getElementById("analytics-panel");
      const analyticsContent = document.getElementById("analytics-content");

      // Track whether the session has been ended (prevents further sends)
      let sessionEnded = false;

      // -----------------------------------------------------------------------
      // UI helpers
      // -----------------------------------------------------------------------

      /** Appends a message bubble to the chat window. */
      function addMessage(role, text) {
        const bubble = document.createElement("div");
        bubble.classList.add("msg", role);

        if (role === "agent") {
          const label = document.createElement("div");
          label.className = "sender-label";
          label.textContent = "Riya";
          bubble.appendChild(label);
        }

        const content = document.createElement("span");
        content.textContent = text;
        bubble.appendChild(content);

        messagesEl.appendChild(bubble);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      /** Shows a "Riya is typing…" indicator; returns the element so it can be removed. */
      function showTypingIndicator() {
        const el = document.createElement("div");
        el.classList.add("msg", "typing");
        el.id = "typing-indicator";
        el.textContent = "Riya is typing…";
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
      }

      function removeTypingIndicator() {
        const el = document.getElementById("typing-indicator");
        if (el) el.remove();
      }

      function setInputDisabled(disabled) {
        inputEl.disabled = disabled;
        sendBtn.disabled = disabled;
      }

      // -----------------------------------------------------------------------
      // Send a message to the backend
      // -----------------------------------------------------------------------
      async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text || sessionEnded) return;

        addMessage("user", text);
        inputEl.value = "";
        inputEl.style.height = "auto"; // reset textarea height
        setInputDisabled(true);

        const typingEl = showTypingIndicator();

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId, message: text }),
          });

          removeTypingIndicator();

          if (!response.ok) {
            const err = await response.json().catch(() => ({}));
            addMessage("agent", err.error || "Something went wrong. Please try again.");
            return;
          }

          const data = await response.json();
          addMessage("agent", data.reply);
        } catch (err) {
          removeTypingIndicator();
          addMessage("agent", "Unable to reach the server. Please check your connection.");
        } finally {
          setInputDisabled(false);
          if (!sessionEnded) inputEl.focus();
        }
      }

      // -----------------------------------------------------------------------
      // End the conversation and fetch analytics
      // -----------------------------------------------------------------------
      async function endSession() {
        if (sessionEnded) return;
        sessionEnded = true;

        endBtn.disabled = true;
        sendBtn.disabled = true;
        inputEl.disabled = true;

        try {
          const response = await fetch("/api/end-session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId }),
          });

          const data = await response.json();

          // Display the analytics panel
          analyticsPanel.style.display = "block";
          analyticsContent.textContent = JSON.stringify(data, null, 2);
          analyticsPanel.scrollIntoView({ behavior: "smooth" });
        } catch (err) {
          analyticsPanel.style.display = "block";
          analyticsContent.textContent = "Failed to load analytics. The server may be unavailable.";
          analyticsPanel.scrollIntoView({ behavior: "smooth" });
        }
      }

      // -----------------------------------------------------------------------
      // Event listeners
      // -----------------------------------------------------------------------
      sendBtn.addEventListener("click", sendMessage);

      // Send on Enter (Shift+Enter inserts a newline)
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Auto-grow textarea height as user types
      inputEl.addEventListener("input", () => {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
      });

      endBtn.addEventListener("click", endSession);

      // -----------------------------------------------------------------------
      // Greeting on load
      // -----------------------------------------------------------------------
      window.addEventListener("load", () => {
        addMessage(
          "agent",
          "Hi there! I'm Riya from Northstar Homes. How can I help you today? Are you looking for a home or an investment?"
        );
        inputEl.focus();
      });
    </script>
  </body>
</html>
